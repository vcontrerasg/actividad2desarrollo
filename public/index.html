<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestor de Productos</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <strong>Gestor de Productos</strong>
    <span id="userbox" class="hidden">
      <span id="who"></span>
      <button class="sec" id="btnLogout">Salir</button>
    </span>
  </header>

  <main>
    <section id="auth" class="card">
      <h2>Acceso</h2>
      <input id="u" aria-label="Usuario" placeholder="Usuario" autocomplete="username">
      <input id="p" aria-label="Contraseña" type="password" placeholder="Contraseña (mín. 8 caracteres)" autocomplete="current-password">
      <div class="row">
        <button id="btnLogin">Iniciar sesión</button>
        <button class="sec" id="btnReg">Registrarme</button>
      </div>
      <p class="msg" id="authMsg"></p>
    </section>

    <section id="app" class="hidden">
      <div class="card">
        <h2 id="formTitle">Nuevo producto</h2>
        <input id="nombre" aria-label="Nombre del Producto" placeholder="Nombre" maxlength="100">
        <textarea id="desc" aria-label="Descripción" placeholder="Descripción" rows="2" maxlength="1000"></textarea>
        <select id="categoria" aria-label="Categoría"></select>
        <div class="row">
          <input id="precio" aria-label="Precio" type="number" min="0" step="0.01" placeholder="Precio">
          <input id="stock" aria-label="Stock" type="number" min="0" step="1" placeholder="Stock">
        </div>
        <div class="row">
          <button id="btnSave">Guardar</button>
          <button class="sec" id="btnCancel">Cancelar</button>
        </div>
        <p class="msg" id="appMsg"></p>
      </div>

      <div class="card">
        <h2>Categorías</h2>
        <ul class="tags" id="listaCategorias"></ul>
        <div class="row">
          <input id="catNombre" aria-label="Nueva categoría" placeholder="Nueva categoría" maxlength="60">
          <button id="btnAddCat">Agregar</button>
        </div>
        <p class="msg" id="catMsg"></p>
      </div>

      <div class="card">
        <h2>Mis productos</h2>
        <table>
          <thead>
            <tr><th>Nombre</th><th>Categoría</th><th>Descripción</th><th>Precio</th><th>Stock</th><th></th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>

      <div class="card hidden" id="movCard">
        <h2 id="movTitle">Movimientos de stock</h2>
        <div class="row">
          <select id="movTipo" aria-label="Tipo de movimiento">
            <option value="entrada">Entrada</option>
            <option value="salida">Retiro</option>
          </select>
          <input id="movCantidad" aria-label="Cantidad" type="number" min="1" step="1" placeholder="Cantidad">
        </div>
        <input id="movMotivo" aria-label="Motivo" placeholder="Motivo (opcional)" maxlength="200">
        <div class="row">
          <button id="btnMovSave">Registrar movimiento</button>
          <button class="sec" id="btnMovClose">Cerrar</button>
        </div>
        <p class="msg" id="movMsg"></p>
        <table>
          <thead>
            <tr><th>Fecha</th><th>Tipo</th><th>Cantidad</th><th>Motivo</th><th>Stock resultante</th></tr>
          </thead>
          <tbody id="movRows"></tbody>
        </table>
      </div>

      <div class="card">
        <h2>Actividad reciente</h2>
        <table>
          <thead>
            <tr><th>Fecha</th><th>Acción</th><th>Entidad</th><th>Detalle</th></tr>
          </thead>
          <tbody id="auditRows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
